version: '3.8'
services:
  diploma-verifier:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./sample_docs:/app/sample_docs
      - ./logs:/app/logs
    environment:
      - ENV=production
      - TMPDIR=/tmp
      - TEMP=/tmp
      - TMP=/tmp
      - MAGIC=/usr/share/misc/magic.mgc
    restart: unless-stopped
